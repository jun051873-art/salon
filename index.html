<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>專屬空間沙龍 - 排休 1 號</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-main: #B8C6DB; 
            --glass-core: rgba(255, 255, 255, 0.25); 
            --gold-line: #d4af37; 
            --rest-pink: rgba(226, 166, 166, 0.9); 
            --off-blue: rgba(162, 185, 188, 0.9);  
        }

        body {
            font-family: -apple-system, "SF Pro Display", "PingFang TC", sans-serif;
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            height: 100vh; color: #333;
            -webkit-touch-callout: none; user-select: none;
            overflow: hidden;
        }

        .header { padding: 60px 20px 10px; text-align: center; }
        
        .shop-name-top {
            font-size: 24px; font-weight: 700;
            background: linear-gradient(to right, #444 20%, #fff 40%, #fff 60%, #444 80%);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 5s linear infinite;
            letter-spacing: 6px;
        }
        @keyframes shine { to { background-position: 200% center; } }

        .page-container {
            flex: 1; width: 100vw;
            position: relative;
            display: flex; align-items: center; justify-content: center;
            perspective: 1200px;
        }

        .month-card {
            position: absolute;
            background: var(--glass-core); 
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            padding: 30px 15px; border-radius: 42px;
            width: 90vw; max-width: 350px; text-align: center;
            box-sizing: border-box;
            border: 0.8px solid var(--gold-line); 
            box-shadow: 0 15px 40px rgba(0,0,0,0.1);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.4s;
        }

        .title-month { font-size: 24px; font-weight: 700; margin-bottom: 15px; color: #444; }
        table { width: 100%; border-collapse: separate; border-spacing: 6px; }
        th { font-size: 11px; color: #666; padding-bottom: 10px; opacity: 0.6; }
        
        td {
            background: rgba(255, 255, 255, 0.2); 
            height: 56px; border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.2s, color 0.2s; cursor: pointer; position: relative;
        }
        .date-num { font-size: 18px; font-weight: 600; margin-top: -2px; }
        .note-text { font-size: 10px; font-weight: 700; position: absolute; bottom: 8px; left: 0; right: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; }

        /* 快選顏色類別 */
        .is-rest { background: var(--rest-pink) !important; color: white !important; }
        .is-off { background: var(--off-blue) !important; color: white !important; }

        .shop-name-pill {
            margin: 30px auto 0;
            display: inline-block;
            padding: 10px 30px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 50px; 
            border: 0.5px solid rgba(255, 255, 255, 0.3);
            font-size: 18px;
            font-weight: 700;
            color: #333;
            letter-spacing: 4px;
        }

        .footer { padding-bottom: 40px; text-align: center; }
        .btn-export {
            padding: 16px; border-radius: 28px; width: 90vw; max-width: 350px;
            background: rgba(0,0,0,0.8); color: white; font-weight: 600;
            border: 0.5px solid var(--gold-line); box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            font-size: 16px;
        }

        .page-out-left { transform: translateX(-120vw) rotateY(-20deg); opacity: 0; }
        .page-out-right { transform: translateX(120vw) rotateY(20deg); opacity: 0; }
        .page-in-left { transform: translateX(-120vw) rotateY(-20deg); opacity: 0; transition: none; }
        .page-in-right { transform: translateX(120vw) rotateY(20deg); opacity: 0; transition: none; }

        /* iOS 風格優雅彈出視窗 */
        .ios-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .ios-modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .ios-modal {
            background: rgba(255, 255, 255, 0.9);
            width: 85vw; max-width: 310px;
            border-radius: 24px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            transform: scale(0.9); transition: transform 0.3s cubic-bezier(0.15, 0.85, 0.2, 1);
            padding: 22px 20px; box-sizing: border-box;
        }
        .ios-modal-overlay.active .ios-modal { transform: scale(1); }

        .ios-modal-title { font-size: 17px; font-weight: 600; margin-bottom: 15px; }
        
        .ios-input {
            width: 100%; box-sizing: border-box;
            background: rgba(0, 0, 0, 0.05); border: none;
            padding: 12px; border-radius: 12px;
            font-size: 16px; text-align: center; margin-bottom: 20px;
            outline: none; font-family: inherit;
        }

        /* 專業無限調色盤區域 */
        .color-picker-box {
            display: flex; align-items: center; justify-content: space-between;
            background: rgba(0,0,0,0.03); padding: 10px 14px; border-radius: 14px;
            margin-bottom: 25px; border: 0.5px solid rgba(0,0,0,0.05);
        }
        .color-picker-label { font-size: 14px; font-weight: 600; color: #444; }
        
        .native-color-wrapper {
            position: relative; width: 44px; height: 44px; border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1); overflow: hidden;
            border: 2px solid #fff; cursor: pointer;
        }
        .native-color-input {
            position: absolute; top: -10px; left: -10px; width: 64px; height: 64px;
            cursor: pointer; border: none; padding: 0; background: transparent;
        }

        .ios-modal-buttons { display: flex; border-top: 0.5px solid rgba(0,0,0,0.15); margin: 0 -20px -20px; }
        .ios-btn {
            flex: 1; padding: 14px; font-size: 17px; background: transparent; border: none; cursor: pointer;
            color: #007aff; font-family: inherit;
        }
        .ios-btn.cancel { border-right: 0.5px solid rgba(0,0,0,0.15); color: #ff3b30; }
        .ios-btn.confirm { font-weight: 600; }
    </style>
</head>
<body>

    <div class="header">
        <div class="shop-name-top">專屬空間沙龍</div>
        <div style="color: #666; font-size: 10px; letter-spacing: 3px; margin-top: 5px; opacity: 0.7;">PREMIUM NO.1</div>
    </div>

    <div class="page-container" id="pageContainer"></div>

    <div class="footer">
        <div style="font-size: 11px; color: #777; margin-bottom: 15px; opacity: 0.6;">點擊快選 ｜ 左右翻頁 ｜ 長按自訂顏色</div>
        <button class="btn-export" onclick="doExport()">📸 儲存精美圖檔</button>
    </div>

    <div class="ios-modal-overlay" id="iosModal">
        <div class="ios-modal">
            <div class="ios-modal-title" id="modalTitle">高級自訂日期</div>
            <input type="text" class="ios-input" id="modalInput" placeholder="自訂文字 (例如: 特休、開會、名字)">
            
            <div class="color-picker-box">
                <div class="color-picker-label">點擊圓圈調配任意色彩</div>
                <div class="native-color-wrapper" id="colorPreview">
                    <input type="color" class="native-color-input" id="modalColor" oninput="updatePreviewColor(this.value)">
                </div>
            </div>

            <div class="ios-modal-buttons">
                <button class="ios-btn cancel" onclick="closeModal()">取消</button>
                <button class="ios-btn confirm" onclick="saveModalData()">確定</button>
            </div>
        </div>
    </div>

    <script>
        const container = document.getElementById('pageContainer');
        let memory = JSON.parse(localStorage.getItem('salon_1_memory')) || {};
        let currentYear = 2026, currentMonth = 1;
        let currentEditingTarget = null;

        function createCard(y, m) {
            const card = document.createElement('div');
            card.className = 'month-card';
            const currentKey = `${y}-${m}`;
            const monthNames = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
            let first = new Date(y, m, 1).getDay(), start = (first === 0) ? 6 : first - 1;
            let days = new Date(y, m+1, 0).getDate(), d = 1;
            
            let tableHtml = '<table><thead><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead><tbody>';
            for (let i=0; i<6; i++) {
                tableHtml += '<tr>';
                for (let j=0; j<7; j++) {
                    if (i === 0 && j < start || d > days) { tableHtml += '<td style="background:transparent; border:none;"></td>'; }
                    else {
                        const dId = d;
                        const saved = memory[currentKey]?.[dId] || { class: '', note: '', customColor: '' };
                        
                        let inlineStyle = saved.customColor ? `background: ${saved.customColor} !important; color: white !important;` : '';

                        tableHtml += `<td class="${saved.class}" style="${inlineStyle}" 
                            onclick="handleDateClick(this, '${currentKey}', ${d})" 
                            oncontextmenu="handleDateLongPress(event, this, '${currentKey}', ${d})"
                            ontouchstart="handleTouchStart(event, this, '${currentKey}', ${d})"
                            ontouchend="handleTouchEnd(event)">
                            <div class="date-num">${d}</div><div class="note-text">${saved.note}</div>
                        </td>`;
                        d++;
                    }
                }
                tableHtml += '</tr>'; if (d > days) break;
            }
            card.innerHTML = `<div style="color:#444; font-size:9px; letter-spacing:2px; margin-bottom:5px; opacity:0.5;">${y} PREMIUM</div><div class="title-month">${monthNames[m]} 排休表</div>${tableHtml}</table><div class="shop-name-pill">專屬空間沙龍</div>`;
            return card;
        }

        let activeCard = createCard(currentYear, currentMonth);
        container.appendChild(activeCard);

        let startX = 0, isSwiping = false;
        container.addEventListener('touchstart', e => { 
            if(e.target.closest('td')) return;
            startX = e.touches[0].clientX; isSwiping = true; 
        }, {passive: true});
        container.addEventListener('touchend', e => {
            if (!isSwiping) return;
            let diff = startX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 70) changeMonth(diff > 0 ? 1 : -1);
            isSwiping = false;
        });

        function changeMonth(dir) {
            const oldCard = activeCard;
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            const newCard = createCard(currentYear, currentMonth);
            newCard.className = 'month-card ' + (dir > 0 ? 'page-in-right' : 'page-in-left');
            container.appendChild(newCard);
            newCard.offsetHeight; 
            oldCard.classList.add(dir > 0 ? 'page-out-left' : 'page-out-right');
            newCard.classList.remove('page-in-right', 'page-in-left');
            activeCard = newCard;
            setTimeout(() => { container.removeChild(oldCard); }, 500);
        }

        window.handleDateClick = function(el, key, dId) {
            if (el.dataset.longPressed === "true") {
                el.dataset.longPressed = "false";
                return;
            }
            const noteObj = el.querySelector('.note-text');
            
            el.style.background = '';
            el.style.color = '';
            let customColor = '';

            if (!el.classList.contains('is-rest') && !el.classList.contains('is-off')) { 
                el.className = 'is-rest'; 
                noteObj.innerText = '店休'; 
            } else if(el.classList.contains('is-rest')) { 
                el.className = 'is-off'; 
                noteObj.innerText = '排休'; 
            } else { 
                el.className = ''; 
                noteObj.innerText = ''; 
            }
            
            updateMemory(key, dId, el.className, noteObj.innerText, customColor);
        };

        let touchTimer;
        window.handleTouchStart = function(e, el, key, dId) {
            el.dataset.longPressed = "false";
            touchTimer = setTimeout(() => {
                el.dataset.longPressed = "true";
                openEditModal(el, key, dId);
            }, 600);
        };
        window.handleTouchEnd = function(e) {
            clearTimeout(touchTimer);
        };

        window.handleDateLongPress = function(e, el, key, dId) {
            e.preventDefault();
            openEditModal(el, key, dId);
        };

        function openEditModal(el, key, dId) {
            currentEditingTarget = { el, key, dId };
            const noteObj = el.querySelector('.note-text');
            
            document.getElementById('modalTitle').innerText = `${currentMonth + 1}月 ${dId} 日 高級設定`;
            document.getElementById('modalInput').value = noteObj.innerText;

            let currentColor = memory[key]?.[dId]?.customColor;
            if(!currentColor) {
                if(el.classList.contains('is-rest')) currentColor = '#e2a6a6';
                else if(el.classList.contains('is-off')) currentColor = '#a2b9bc';
                else currentColor = '#ffffff';
            }
            
            document.getElementById('modalColor').value = rgbToHex(currentColor) || '#ffffff';
            updatePreviewColor(currentColor);
            document.getElementById('iosModal').classList.add('active');
        }

        window.updatePreviewColor = function(val) {
            document.getElementById('colorPreview').style.backgroundColor = val;
        };

        window.closeModal = function() {
            document.getElementById('iosModal').classList.remove('active');
            currentEditingTarget = null;
        };

        window.saveModalData = function() {
            if (!currentEditingTarget) return;
            const { el, key, dId } = currentEditingTarget;
            const noteObj = el.querySelector('.note-text');
            const inputText = document.getElementById('modalInput').value.trim();
            const selectedColor = document.getElementById('modalColor').value;

            el.className = '';
            
            if(selectedColor.toLowerCase() === '#ffffff') {
                el.style.background = '';
                el.style.color = '';
                noteObj.innerText = inputText;
                updateMemory(key, dId, '', inputText, '');
            } else {
                el.style.setProperty('background', selectedColor, 'important');
                el.style.setProperty('color', '#ffffff', 'important');
                noteObj.innerText = inputText;
                updateMemory(key, dId, '', inputText, selectedColor);
            }

            closeModal();
        };

        function updateMemory(key, dId, cls, note, customColor) {
            if(!memory[key]) memory[key] = {};
            memory[key][dId] = { class: cls, note: note, customColor: customColor };
            localStorage.setItem('salon_1_memory', JSON.stringify(memory));
        }

        function rgbToHex(col) {
            if(!col) return "#ffffff";
            if(col.startsWith('#')) return col;
            let rgb = col.match(/\d+/g);
            if(!rgb) return "#ffffff";
            return "#" + ((1 << 24) + (parseInt(rgb[0]) << 16) + (parseInt(rgb[1]) << 8) + parseInt(rgb[2])).toString(16).slice(1);
        }

        window.doExport = function() {
            html2canvas(activeCard, { 
                scale: 3, 
                backgroundColor: null, 
                useCORS: true,
                allowTaint: true,
                logging: false,
                onclone: function(clonedDoc) {
                    const el = clonedDoc.querySelector('.shop-name-pill');
                    if(el) el.style.background = 'rgba(255, 255, 255, 0.4)';
                }
            }).then(c => {
                let l = document.createElement('a');
                l.download = `排休1號-${currentMonth+1}月.png`;
                l.href = c.toDataURL("image/png");
                l.click();
            }).catch(err => {
                alert("儲存圖片失敗，請確認您的瀏覽器是否支援或允許權限。");
            });
        };
    </script>
</body>
</html>
